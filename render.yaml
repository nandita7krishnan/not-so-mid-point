# Render blueprint. In the Render dashboard: New > Blueprint, point it at this
# repo, then paste GOOGLE_MAPS_API_KEY into the prompt it shows.
#
# The two API keys are marked `sync: false`, which means Render asks for them
# rather than reading them from this file. Never commit a key here.
services:
  - type: web
    name: not-so-mid-point
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /api/health
    # The anchor file is built here rather than committed: it comes from GTFS
    # feeds that change every few weeks, so a deploy should carry a fresh one.
    # `|| true` because a feed being down is not a reason to fail a deploy --
    # without the file the app falls back to naming a start by neighbourhood.
    buildCommand: pip install -r backend/requirements.txt && (cd backend && python -m evals.fetch_anchors || true)
    # One worker on purpose: the rate limiter keeps its counters in process
    # memory, so a second worker would silently double every limit.
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Public deployment: limits on, and the client IP arrives via Render's proxy.
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # Per visitor.
      - key: RECOMMEND_PER_HOUR
        value: "12"
      - key: RECOMMEND_PER_DAY
        value: "40"
      - key: AUTOCOMPLETE_PER_MINUTE
        value: "60"
      # Instance-wide ceiling, and the only thing that precisely bounds the
      # bill: Google's own Places quota cannot be set tight enough, because
      # free autocomplete requests share that API's request counter with
      # billable venue searches. 8/day keeps Places Enterprise (1,000/month
      # free) inside its allowance for category searches.
      - key: GLOBAL_RECOMMEND_PER_DAY
        value: "8"
      # Render's filesystem is ephemeral, so the cache is a warm-start bonus
      # rather than something to rely on.
      - key: CACHE_DIR
        value: "/tmp/nsmp-cache"
      # Record each search as eval input. Coarsened on the way in: no typed
      # address, no participant names, a start named by the nearest transit
      # stop or neighbourhood. See docs/EVALS.md.
      - key: SEARCH_LOG_ENABLED
        value: "true"
      # Same ephemeral disk, so this file is a convenience and the log line is
      # the copy that lasts. Recover records with `python -m evals.from_logs`.
      - key: SEARCH_LOG_DIR
        value: "/tmp/nsmp-searchlog"
